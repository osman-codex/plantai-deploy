services:
  # PlantGuard AI backend: FastAPI + real model inference (CPU).
  # The model file (~16MB) lives in models/ and is committed to the repo,
  # so no external storage is needed.
  - type: web
    name: plantguard-backend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    # Render sets $PORT; start.sh forwards it to uvicorn
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        value: sqlite:////tmp/plantguard.db
      - key: DATA_DIR
        value: /tmp/plantguard_data
      - key: CONFIDENCE_THRESHOLD
        value: "0.55"
      - key: TOP_K
        value: "3"
      - key: CORS_ORIGINS
        value: "*"
